# 1단계: 인증서 발급 전 HTTP로 먼저 기동 (certbot webroot 인증용)
server {
    listen 80;
    server_name myfamilyhub.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'MyFamily Hub server is up. App container not deployed yet.';
        add_header Content-Type text/plain;
    }
}

